name: Release Build

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "VERSION=$VERSION"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Decode signing keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 || vars.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "${SIGNING_KEYSTORE_BASE64}" ]; then
            echo "Missing SIGNING_KEYSTORE_BASE64"
            exit 1
          fi
          echo "${SIGNING_KEYSTORE_BASE64}" | base64 -d > app/voxly-release.keystore

      - name: Build with Gradle
        uses: gradle/gradle-build-action@v2
        env:
          CI: true
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD || vars.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD || vars.SIGNING_KEY_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS || vars.SIGNING_KEY_ALIAS || 'voxly' }}
        with:
          arguments: assembleGithubRelease

      - name: Clean up keystore
        if: always()
        run: rm -f app/voxly-release.keystore

      - name: Prepare release artifact
        shell: bash
        run: |
          set -euo pipefail
          
          # Find APK (github flavor + release build type)
          APK_PATH="$(find app/build -type f -name "*arm64*.apk" | head -n 1)"
          if [ -z "${APK_PATH}" ]; then
            echo "No APK found"
            exit 1
          fi

          VERSION_NAME="${{ steps.version.outputs.VERSION }}"
          SHORT_SHA="${GITHUB_SHA::7}"

          OUT_DIR="app/build/outputs/release-assets"
          mkdir -p "${OUT_DIR}"
          OUT_NAME="Voxly-${VERSION_NAME}-${SHORT_SHA}.apk"
          cp "${APK_PATH}" "${OUT_DIR}/${OUT_NAME}"
          echo "RELEASE_APK=${OUT_DIR}/${OUT_NAME}" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: Voxly v${{ steps.version.outputs.VERSION }}
          generate_release_notes: true
          files: ${{ env.RELEASE_APK }}
