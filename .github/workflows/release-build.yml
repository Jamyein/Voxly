name: Release Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (without v prefix, e.g., 1.2.3)'
        required: true
        type: string
      changelog:
        description: 'Manual changelog (optional, markdown supported)'
        required: false
        type: textarea

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from input
        id: version
        run: |
          VERSION="${{ github.event.inputs.version }}"
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "VERSION=$VERSION"

      - name: Generate changelog
        id: changelog
        shell: bash
        run: |
          set -euo pipefail

          # Find previous tag
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            echo "Previous tag: $PREV_TAG"
            COMMIT_RANGE="${PREV_TAG}..HEAD"
          else
            echo "No previous tag found, using all commits"
            COMMIT_RANGE="HEAD"
          fi

          # Collect commits by type
          declare -A SECTIONS TEMP_MAP
          SECTIONS=(
            ["feat"]="✨ 新功能"
            ["fix"]="🐛 修复"
            ["refactor"]="♻️ 重构"
            ["docs"]="📝 文档"
            ["chore"]="🔧 杂项"
            ["perf"]="⚡ 性能优化"
            ["style"]="💄 样式"
            ["test"]="✅ 测试"
          )

          ORDER=("feat" "fix" "refactor" "docs" "chore" "perf" "style" "test")
          OTHERS=""

          while IFS= read -r line; do
            [ -z "$line" ] && continue
            msg=$(echo "$line" | sed 's/^[a-f0-9]* //')
            matched=false
            for type in "${ORDER[@]}"; do
              if echo "$msg" | grep -qi "^${type}"; then
                if [ -z "${TEMP_MAP[$type]+x}" ]; then
                  TEMP_MAP[$type]=""
                fi
                TEMP_MAP[$type]+="- ${msg}\n"
                matched=true
                break
              fi
            done
            if [ "$matched" = false ]; then
              OTHERS+="- ${msg}\n"
            fi
          done < <(git log --pretty=format:"%H %s" $COMMIT_RANGE)

          # Build markdown output
          AUTO_CHANGELOG=""
          for type in "${ORDER[@]}"; do
            if [ -n "${TEMP_MAP[$type]+x}" ]; then
              AUTO_CHANGELOG+="### ${SECTIONS[$type]}
${TEMP_MAP[$type]}
"
            fi
          done
          if [ -n "$OTHERS" ]; then
            AUTO_CHANGELOG+="### 📦 其他
${OTHERS}
"
          fi

          # Save to env
          echo "AUTO_CHANGELOG<<GITHUB_ENV_EOF" >> "$GITHUB_ENV"
          echo "$AUTO_CHANGELOG" >> "$GITHUB_ENV"
          echo "GITHUB_ENV_EOF" >> "$GITHUB_ENV"

      - name: Assemble release body
        shell: bash
        run: |
          set -euo pipefail

          MANUAL="${{ github.event.inputs.changelog }}"
          AUTO="${AUTO_CHANGELOG}"
          BODY=""

          if [ -n "$MANUAL" ]; then
            BODY="## 📋 更新说明
${MANUAL}

---
"
          fi

          if [ -n "$AUTO" ]; then
            BODY+="## 🔄 变更日志
${AUTO}"
          fi

          if [ -z "$BODY" ]; then
            BODY="Voxly v${{ steps.version.outputs.VERSION }}"
          fi

          echo "RELEASE_BODY<<GITHUB_ENV_EOF" >> "$GITHUB_ENV"
          echo "$BODY" >> "$GITHUB_ENV"
          echo "GITHUB_ENV_EOF" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Decode signing keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 || vars.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "${SIGNING_KEYSTORE_BASE64}" ]; then
            echo "Missing SIGNING_KEYSTORE_BASE64"
            exit 1
          fi
          echo "${SIGNING_KEYSTORE_BASE64}" | base64 -d > app/voxly-release.keystore

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build with Gradle
        uses: gradle/gradle-build-action@v2
        env:
          CI: true
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD || vars.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD || vars.SIGNING_KEY_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS || vars.SIGNING_KEY_ALIAS || 'voxly' }}
        with:
          arguments: assembleGithubRelease

      - name: Clean up keystore
        if: always()
        run: rm -f app/voxly-release.keystore

      - name: Prepare release artifact
        shell: bash
        run: |
          set -euo pipefail
          
          # Find APK (github flavor + release build type)
          APK_PATH="$(find app/build -type f -name "*arm64*.apk" | head -n 1)"
          if [ -z "${APK_PATH}" ]; then
            echo "No APK found"
            exit 1
          fi

          VERSION_NAME="${{ steps.version.outputs.VERSION }}"
          SHORT_SHA="${GITHUB_SHA::7}"

          OUT_DIR="app/build/outputs/release-assets"
          mkdir -p "${OUT_DIR}"
          OUT_NAME="Voxly-${VERSION_NAME}-${SHORT_SHA}.apk"
          cp "${APK_PATH}" "${OUT_DIR}/${OUT_NAME}"
          echo "RELEASE_APK=${OUT_DIR}/${OUT_NAME}" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: Voxly v${{ steps.version.outputs.VERSION }}
          body: ${{ env.RELEASE_BODY }}
          files: ${{ env.RELEASE_APK }}
