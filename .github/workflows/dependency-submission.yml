name: Gradle Dependency Submission
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  submit-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/wrapper-gradle-build-action@v1

      - name: Generate dependency graph
        uses: gradle/gradle-build-action@v2
        with:
          arguments: dependencies --configuration debugRuntimeClasspath

      - uses: actions/dependency-submission-action@v5
        with:
          build-type: debug