name: Dev Build

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Decode signing keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 || vars.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "${SIGNING_KEYSTORE_BASE64}" ]; then
            echo "Missing SIGNING_KEYSTORE_BASE64 (configure in Secrets or Variables)"
            exit 1
          fi
          echo "${SIGNING_KEYSTORE_BASE64}" | base64 -d > app/voxly-release.keystore
          if [ ! -s app/voxly-release.keystore ]; then
            echo "Decoded keystore is empty"
            exit 1
          fi

      - name: Validate signing inputs
        shell: bash
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD || vars.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD || vars.SIGNING_KEY_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS || vars.SIGNING_KEY_ALIAS }}
        run: |
          if [ -z "${SIGNING_STORE_PASSWORD}" ]; then
            echo "Missing SIGNING_STORE_PASSWORD (Secrets or Variables)"
            exit 1
          fi
          if [ -z "${SIGNING_KEY_PASSWORD}" ]; then
            echo "Missing SIGNING_KEY_PASSWORD (Secrets or Variables)"
            exit 1
          fi
          echo "SIGNING_KEY_ALIAS=${SIGNING_KEY_ALIAS:-voxly}" >> "$GITHUB_ENV"

      - name: Build Dist APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD || vars.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD || vars.SIGNING_KEY_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ env.SIGNING_KEY_ALIAS }}
        run: ./gradlew assembleDist

      - name: Clean up keystore
        if: always()
        run: rm -f app/voxly-release.keystore

      - name: Rename APK with hash and timestamp
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH="$(find app/build -type f -path "*/apk/dist/*.apk" | head -n 1)"
          if [ -z "${APK_PATH}" ]; then
            echo "No dist APK found"
            exit 1
          fi
          TS="$(date +%Y%m%d%H%M%S)"
          SHORT_SHA="${GITHUB_SHA::7}"
          OUT_DIR="app/build/outputs/renamed"
          mkdir -p "${OUT_DIR}"
          OUT_NAME="Voxly-debug-${SHORT_SHA}-${TS}.apk"
          cp "${APK_PATH}" "${OUT_DIR}/${OUT_NAME}"
          echo "RENAMED_APK=${OUT_DIR}/${OUT_NAME}" >> "$GITHUB_ENV"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Voxly-debug
          path: ${{ env.RENAMED_APK }}
          retention-days: 30
