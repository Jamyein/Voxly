name: CommitBuild

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Decode signing keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 || vars.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "${SIGNING_KEYSTORE_BASE64}" ]; then
            echo "${SIGNING_KEYSTORE_BASE64}" | base64 -d > app/voxly-release.keystore
          fi

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build with Gradle
        run: |
          ./gradlew assembleGithubRelease -Pandroid.injected.build.abi=arm64-v8a
        env:
          CI: true
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD || vars.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD || vars.SIGNING_KEY_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS || vars.SIGNING_KEY_ALIAS || 'voxly' }}

      - name: Clean up keystore
        if: always()
        run: rm -f app/voxly-release.keystore

      - name: Find and rename APK
        shell: bash
        run: |
set -euo pipefail

# Gradle outputs the final release apk in this directory (verified locally)
RELEASE_DIR="app/github/release"
mkdir -p "${RELEASE_DIR}"

# Grab the first apk that matches our naming convention
APK_PATH="$(find "${RELEASE_DIR}" -type f -name 'app-github-arm64-v8a-release.apk' | head -n 1)"
if [ -z "${APK_PATH}" ]; then
  echo "No APK found in ${RELEASE_DIR}"
  exit 1
fi

# Extract versionName from build.gradle.kts
VERSION_NAME=$(grep -oP 'versionName\s*=\s*"[^"]+"' app/build.gradle.kts | cut -d\" -f2)
SHORT_SHA="${GITHUB_SHA::7}"
OUT_DIR="${RELEASE_DIR}"
mkdir -p "${OUT_DIR}"
OUT_NAME="Voxly-${VERSION_NAME}-${SHORT_SHA}.apk"
cp "${APK_PATH}" "${OUT_DIR}/${OUT_NAME}"
echo "RENAMED_APK=${OUT_DIR}/${OUT_NAME}" >> "$GITHUB_ENV"

      - name: Upload Dev APK
        uses: actions/upload-artifact@v4
        with:
          name: Voxly-GitHub-Build-${{ github.sha }}
          path: ${{ env.RENAMED_APK }}
          retention-days: 30
