name: CommitBuild

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Decode signing keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 || vars.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "${SIGNING_KEYSTORE_BASE64}" ]; then
            echo "${SIGNING_KEYSTORE_BASE64}" | base64 -d > app/voxly-release.keystore
          fi

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build with Gradle
        run: |
          ./gradlew assembleGithubRelease
        env:
          CI: true
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD || vars.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD || vars.SIGNING_KEY_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS || vars.SIGNING_KEY_ALIAS || 'voxly' }}

      - name: Clean up keystore
        if: always()
        run: rm -f app/voxly-release.keystore

      - name: Find and rename APK
        shell: bash
        run: |
          set -euo pipefail

          # Find APK
          APK_PATH="$(find app/build -type f -name "*.apk" | head -n 1)"
          if [ -z "${APK_PATH}" ]; then
            echo "No APK found"
            exit 1
          fi

          # Extract VERSION_NAME from build.gradle.kts
          VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          SHORT_SHA="${GITHUB_SHA::7}"
          OUT_DIR="app/build/outputs/apk/github/release"
          mkdir -p "${OUT_DIR}"
          OUT_NAME="Voxly-${VERSION_NAME}-${SHORT_SHA}.apk"
          cp "${APK_PATH}" "${OUT_DIR}/${OUT_NAME}"
          echo "RENAMED_APK=${OUT_DIR}/${OUT_NAME}" >> "$GITHUB_ENV"

      - name: Upload Dev APK
        uses: actions/upload-artifact@v4
        with:
          name: Voxly-GitHub-Build-${{ github.sha }}
          path: ${{ env.RENAMED_APK }}
          retention-days: 30
