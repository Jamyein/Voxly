name: CommitBuild

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build with Gradle
        id: build
        env:
          CI: true
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 || vars.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD || vars.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD || vars.SIGNING_KEY_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS || vars.SIGNING_KEY_ALIAS || 'voxly' }}
        run: |
          set -euo pipefail
          if [ -n "${SIGNING_KEYSTORE_BASE64}" ] && \
             [ -n "${SIGNING_STORE_PASSWORD}" ] && \
             [ -n "${SIGNING_KEY_PASSWORD}" ]; then
            echo "TASK=assembleGithubRelease" >> "$GITHUB_OUTPUT"
            echo "APK_DIR=app/build/outputs/apk/github/release" >> "$GITHUB_OUTPUT"
            echo "${SIGNING_KEYSTORE_BASE64}" | base64 -d > app/voxly-release.keystore
            trap 'rm -f app/voxly-release.keystore' EXIT
            ./gradlew assembleGithubRelease -PbuildAbi=arm64-v8a,x86_64
          else
            echo "TASK=assembleGithubDebug" >> "$GITHUB_OUTPUT"
            echo "APK_DIR=app/build/outputs/apk/github/debug" >> "$GITHUB_OUTPUT"
            ./gradlew assembleGithubDebug -PbuildAbi=arm64-v8a,x86_64
          fi

      - name: Find and rename APKs
        shell: bash
        run: |
          set -euo pipefail

          APK_DIR="${{ steps.build.outputs.APK_DIR }}"
          SHORT_SHA="${GITHUB_SHA::7}"
          OUT_DIR="app/dist"
          mkdir -p "${OUT_DIR}"
          rm -f "${OUT_DIR}"/*.apk

          find "${APK_DIR}" -type f -name '*.apk' -not -name '*-unsigned*' 2>/dev/null | while IFS= read -r APK_PATH; do
            [ -z "${APK_PATH}" ] && continue
            APK_BASENAME=$(basename "${APK_PATH}" .apk)
            cp "${APK_PATH}" "${OUT_DIR}/${APK_BASENAME}-${SHORT_SHA}.apk"
            echo "Copied ${APK_PATH} -> ${OUT_DIR}/${APK_BASENAME}-${SHORT_SHA}.apk"
          done

          if ! find "${OUT_DIR}" -type f -name '*.apk' -print -quit | grep -q .; then
            echo "No APK found in ${APK_DIR}, listing all APK files:"
            find app -type f -name '*.apk' 2>/dev/null || echo "(no apk files found)"
            exit 1
          fi

      - name: Upload Dev APKs
        uses: actions/upload-artifact@v4
        with:
          name: Voxly-GitHub-Build-${{ github.sha }}
          path: app/dist/*.apk
          retention-days: 30
